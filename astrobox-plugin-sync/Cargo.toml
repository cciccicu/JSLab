[package]
name = "jslab-astrobox-sync"
version = "2.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
astrobox-ng-wit = "=0.3.1"
waki = "0.5.1"

[profile.release]
lto = true
opt-level = "s"
strip = true
