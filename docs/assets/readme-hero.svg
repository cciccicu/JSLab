<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">JSLab · 在手腕上编写、运行和分享 JavaScript</title>
  <desc id="description">JSLab 原有青蓝与明黄色标志、项目名称，以及使用 ui.signal 和 ui.render 创建原生计数器的代码。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#f0f7fb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#23465b" flood-opacity=".07"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1278" height="358" rx="20" fill="url(#paper)" stroke="#dfe9ef"/>
  <g font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif">
    <image x="57" y="69" width="106" height="106" href="data:image/png;base64,"/>
    <text x="187" y="91" fill="#568397" font-size="13" font-weight="600" letter-spacing="2.5">JAVASCRIPT FOR XIAOMI VELA</text>
    <text x="181" y="168" fill="#162c3d" font-size="87" font-weight="750" letter-spacing="-4">JSLab</text>
    <text x="62" y="232" fill="#253f51" font-size="28" font-weight="500">在手腕上编写、运行和分享 JavaScript</text>
    <g fill="#537487" font-size="17">
      <text x="63" y="292">设备端编辑器</text>
      <text x="208" y="292">原生 UI</text>
      <text x="310" y="292">独立应用导出</text>
    </g>
    <circle cx="188" cy="286" r="2" fill="#0a9fcd"/>
    <circle cx="290" cy="286" r="2" fill="#0a9fcd"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="718" y="37" width="504" height="286" rx="14" fill="#fff" stroke="#d4e2eb"/>
    <path d="M719 83h502" stroke="#e6edf2"/>
    <rect x="740" y="51" width="25" height="20" rx="4" fill="#fff1a8"/>
    <text x="752.5" y="65" fill="#685b14" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="11">JS</text>
    <text x="778" y="65" fill="#5d7485" font-family="Segoe UI, sans-serif" font-size="13">counter.js</text>
    <circle cx="1177" cy="60" r="3" fill="#13a2cc"/>
    <text x="1189" y="65" fill="#5d7485" font-family="Segoe UI, sans-serif" font-size="11">UI</text>
  </g>
  <g font-family="Consolas, Liberation Mono, Microsoft YaHei, monospace" font-size="16">
    <g fill="#a0b1bd" text-anchor="end">
      <text x="751" y="113">1</text><text x="751" y="136">2</text><text x="751" y="159">3</text>
      <text x="751" y="182">4</text><text x="751" y="205">5</text><text x="751" y="228">6</text>
      <text x="751" y="251">7</text><text x="751" y="274">8</text><text x="751" y="297">9</text>
    </g>
    <g fill="#334d60">
      <text x="774" y="113"><tspan fill="#8250a5">const</tspan> count = ui.<tspan fill="#087fa5">signal</tspan>(<tspan fill="#b46b14">0</tspan>);</text>
      <text x="774" y="159">ui.<tspan fill="#087fa5">render</tspan>(() =&gt; [</text>
      <text x="793" y="182">ui.<tspan fill="#087fa5">heading</tspan>(<tspan fill="#477b34">'计数器'</tspan>),</text>
      <text x="793" y="205">ui.<tspan fill="#087fa5">text</tspan>(count.get()),</text>
      <text x="793" y="228">ui.<tspan fill="#087fa5">button</tspan>(<tspan fill="#477b34">'加一'</tspan>, () =&gt; {</text>
      <text x="812" y="251">count.<tspan fill="#087fa5">update</tspan>(n =&gt; n + <tspan fill="#b46b14">1</tspan>);</text>
      <text x="793" y="274">})</text>
      <text x="774" y="297">]);</text>
    </g>
  </g>
</svg>
